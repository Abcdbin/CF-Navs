name: Sync upstream

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/lbjxr/CF-Navs.git
          git fetch upstream main
          git checkout main
          git merge --ff-only upstream/main
          git push origin main

      - name: Enable upstream workflows
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json name,path,state \
            | jq -r '.[] | select(.path | test("sync-upstream") | not) | select(.state != "active") | .path' \
            | while read -r wf; do
                [ -n "$wf" ] && gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY" || true
              done
